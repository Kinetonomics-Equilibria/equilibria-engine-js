name: Azure Static Web Apps

# Deploys the webapp to econ.knovia.com.au, an Azure Static Web App on the
# Free plan. Routing and caching are in apps/web/public/staticwebapp.config.json,
# which Vite copies into dist/; it does for Azure what netlify.toml does for
# Netlify, and both stay until the Netlify site is retired.
#
# The gate is the one Netlify runs: typecheck, then build. Tests run locally,
# not here. Vite strips types without checking them, so without the typecheck
# a type error would deploy; with it, a failing check leaves the last good
# deploy live.
#
# The deployment token is the Static Web App's (portal: Overview → Manage
# deployment token), saved as the repository secret
# AZURE_STATIC_WEB_APPS_API_TOKEN. `npm run deploy` is the same deploy from
# your own machine, for when this cannot run.
on:
  push:
    branches: [master]
    # Docs do not reach dist/, so a docs-only push has nothing to deploy.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

# A burst of pushes deploys only the last one. The group is per-ref, and a
# cancel mid-upload leaves the previous deploy in place.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Typecheck, Build and Deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # From the repo root: the webapp consumes the engine and React bindings
      # as workspace source, so every workspace has to install.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          # Built above, so the Node version and build command are the ones
          # used locally, not whatever Azure's builder picks.
          skip_app_build: true
          app_location: apps/web/dist
          api_location: ''
          output_location: ''
