<svg xmlns="http://www.w3.org/2000/svg" width="1012" height="400" viewBox="0 0 1012 400">
  <!-- The terms of trade lesson's cover: an ore carrier heading out and a
       container ship coming in, passing. What Australia sells and what it
       buys, the two prices the lesson divides. Flat shapes in the screen's
       slate and the fx cover's muted terracotta for the ore, so nothing here
       borrows a curve's colour (docs/design.md: colour means one thing). -->
  <rect width="1012" height="400" fill="#eef4fb"/>
  <circle cx="506" cy="96" r="52" fill="#ffe8cc"/>
  <path d="M0 262 C 70 236, 150 246, 230 228 C 290 216, 340 234, 400 240 L400 300 L0 300 Z" fill="#dbe7f3"/>
  <rect y="284" width="1012" height="116" fill="#cfe0f1"/>

  <!-- The ore carrier, heading right. -->
  <path d="M64 252 L438 252 L464 296 L92 296 Z" fill="#243b53"/>
  <rect x="92" y="274" width="350" height="5" fill="#9fb3c8"/>
  <g fill="#c8693b">
    <path d="M150 252 Q 186 216 222 252 Z"/>
    <path d="M232 252 Q 268 212 304 252 Z"/>
    <path d="M314 252 Q 346 220 378 252 Z"/>
  </g>
  <rect x="78" y="192" width="62" height="60" rx="3" fill="#f8f9fa" stroke="#243b53" stroke-width="3"/>
  <rect x="86" y="204" width="46" height="10" rx="2" fill="#243b53"/>
  <rect x="100" y="168" width="18" height="24" fill="#243b53"/>

  <!-- The container ship, heading left. -->
  <path d="M948 312 L560 312 L532 358 L918 358 Z" fill="#334e68"/>
  <rect x="552" y="334" width="362" height="5" fill="#9fb3c8"/>
  <g stroke="#eef4fb" stroke-width="3">
    <g fill="#829ab1">
      <rect x="590" y="282" width="56" height="30"/>
      <rect x="716" y="282" width="56" height="30"/>
      <rect x="772" y="252" width="56" height="30"/>
    </g>
    <g fill="#bcccdc">
      <rect x="646" y="282" width="70" height="30"/>
      <rect x="590" y="252" width="56" height="30"/>
      <rect x="772" y="282" width="56" height="30"/>
    </g>
    <g fill="#627d98">
      <rect x="646" y="252" width="70" height="30"/>
      <rect x="716" y="252" width="56" height="30"/>
    </g>
  </g>
  <rect x="852" y="248" width="66" height="64" rx="3" fill="#f8f9fa" stroke="#243b53" stroke-width="3"/>
  <rect x="860" y="260" width="50" height="10" rx="2" fill="#243b53"/>
  <rect x="876" y="224" width="18" height="24" fill="#243b53"/>

  <g fill="none" stroke="#b6cfe8" stroke-width="3" stroke-linecap="round">
    <path d="M40 328 q 14 -8 28 0 t 28 0"/>
    <path d="M300 352 q 14 -8 28 0 t 28 0"/>
    <path d="M470 330 q 14 -8 28 0 t 28 0"/>
    <path d="M120 374 q 14 -8 28 0 t 28 0"/>
    <path d="M956 378 q 14 -8 28 0 t 28 0"/>
  </g>
</svg>
