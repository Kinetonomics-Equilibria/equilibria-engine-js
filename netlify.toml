# Netlify builds from the repo root, not apps/web: the webapp consumes the
# engine and React bindings as workspace source, so npm has to install every
# workspace for `equilibria-engine-js` and `equilibria-react` to resolve.
[build]
  # Vite strips types without checking them, so a type error would otherwise
  # deploy. Typechecking first fails the build and leaves the last good deploy
  # live.
  command = "npm run typecheck && npm run build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "24"

# Vite fingerprints every file under assets/, so a changed file gets a new
# name and the old one can be cached for good. index.html keeps its name and
# keeps Netlify's default of revalidating on every load.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Every page is a path the app reads (`lessons/fx`, `playground/aud`), and
# there is one `index.html`: Netlify serves it for any path that is not a
# file, so a link opens on a first visit and on a refresh. A file that exists,
# such as anything under assets/, is served as it is.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
